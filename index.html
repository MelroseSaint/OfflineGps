<!doctype html>
<html lang="en">
  <head>
    <script>
      // Clean up stale service workers on version change.
      // Only reload once per version change to avoid killing GPS init.
      if ('serviceWorker' in navigator) {
        var SW_VERSION = 'wayline-v2';
        var prev = sessionStorage.getItem('sw-version');
        if (prev && prev !== SW_VERSION) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
            sessionStorage.setItem('sw-version', SW_VERSION);
            window.location.reload();
          });
        } else {
          sessionStorage.setItem('sw-version', SW_VERSION);
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Wayline — Offline Navigation</title>
    <meta
      name="description"
      content="Offline-first GPS navigation with a Smart Offline Cache. Free, private, no account."
    />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wayline" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
